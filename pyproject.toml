[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-layer-optimizer"
version = "0.5.0b2"
description = "Profile Docker deployment regressions and verify agent-proposed build optimizations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Oliver Taylor", email = "35031747+OliverTaylor246@users.noreply.github.com"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["docker", "buildkit", "cache", "layers", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/OliverTaylor246/docker-layer-optimizer"
Repository = "https://github.com/OliverTaylor246/docker-layer-optimizer"
Issues = "https://github.com/OliverTaylor246/docker-layer-optimizer/issues"

[project.scripts]
dlo = "docker_layer_optimizer:main"
docker-layer-optimizer = "docker_layer_optimizer:main"

[tool.setuptools]
package-dir = {"" = "skills/optimize-docker-layers/scripts"}
py-modules = ["docker_layer_optimizer", "build_observer", "deployment_observer", "optimization_engine", "registry_observer"]
