name: docker-integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go build -o /usr/local/bin/dlo ./cmd/dlo
      - run: docker buildx version
      - name: Run native Docker lifecycle integration tests
        env:
          DLO_DOCKER_INTEGRATION: "1"
        run: go test ./internal/integration -v -count=1 -timeout=20m
