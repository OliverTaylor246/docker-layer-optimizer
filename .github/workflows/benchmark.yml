name: benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Repeated builds per change type
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [python, node, go, monorepo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: go build -o /usr/local/bin/dlo ./cmd/dlo
      - name: Run reproducible benchmark harness
        run: >-
          python benchmarks/run_benchmarks.py
          --cases ${{ matrix.case }}
          --iterations ${{ inputs.iterations }}
          --output benchmark-${{ matrix.case }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.case }}
          path: benchmark-${{ matrix.case }}.json
          if-no-files-found: error
