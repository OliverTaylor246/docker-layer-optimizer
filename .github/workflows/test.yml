name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills/optimize-docker-layers/scripts/docker_layer_optimizer.py skills/optimize-docker-layers/scripts/build_observer.py skills/optimize-docker-layers/scripts/deployment_observer.py skills/optimize-docker-layers/scripts/registry_observer.py benchmarks/run_benchmarks.py tests/deployment_integration.py tests/docker_integration.py
      - run: python -m pip install .
      - run: dlo --help
      - run: python tests/deployment_integration.py
      - run: python -m json.tool .codex-plugin/plugin.json
      - run: python -m json.tool .claude-plugin/plugin.json
      - run: python -m json.tool .claude-plugin/marketplace.json
      - run: python -m json.tool .agents/plugins/marketplace.json
      - run: python -m json.tool docs/observation-schema-v3.json
