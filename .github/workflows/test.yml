name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile skills/optimize-docker-layers/scripts/docker_layer_optimizer.py skills/optimize-docker-layers/scripts/build_observer.py
      - run: python -m pip install .
      - run: dlo --help
      - run: python -m json.tool .codex-plugin/plugin.json
      - run: python -m json.tool .claude-plugin/plugin.json
      - run: python -m json.tool .claude-plugin/marketplace.json
      - run: python -m json.tool .agents/plugins/marketplace.json
